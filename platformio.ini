; PlatformIO Project Configuration File
;
; Two environments: panel-42 (4.2" single SSD1683) and panel-579 (5.79" dual SSD1683)
; Build with: pio run -e panel-42  OR  pio run -e panel-579
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.11
	olikraus/U8g2@^2.36.17
	olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
	https://github.com/tzapu/WiFiManager.git
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/me-no-dev/AsyncTCP.git
	arduino-libraries/Arduino_JSON @ ^0.2.0
	ricmoo/QRCode @ ^0.0.1
board_build.partitions = partitions.csv
upload_speed = 460800
monitor_speed = 115200

[env:panel-42]
build_flags = 
	-DFIRMWARE_VERSION='"v0.3.8"'
	-DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110

[env:panel-579]
build_flags = 
	-DPANEL_579
	-DFIRMWARE_VERSION='"v0.4.0-5.79"'
	-DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
upload_port = /dev/cu.usbserial-1110
monitor_port = /dev/cu.usbserial-1110
